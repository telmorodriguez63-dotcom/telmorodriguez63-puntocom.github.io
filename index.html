<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control Lavadero</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen font-sans">

    <div id="pantalla-login" class="flex flex-col items-center justify-center min-h-screen p-4">
        <div class="bg-gray-800 p-8 rounded-xl shadow-lg w-full max-w-sm border border-gray-700">
            <h1 class="text-3xl font-bold text-center text-blue-400 mb-6">Lavadero Control</h1>
            
            <label class="block text-gray-400 text-sm mb-2">Usuario</label>
            <input type="text" id="login-usuario" class="w-full p-3 bg-gray-700 text-white rounded-lg mb-4 outline-none focus:ring-2 focus:ring-blue-500" placeholder="Ej: oscar, jesus, santiago">
            
            <label class="block text-gray-400 text-sm mb-2">Contraseña</label>
            <input type="password" id="login-password" class="w-full p-3 bg-gray-700 text-white rounded-lg mb-6 outline-none focus:ring-2 focus:ring-blue-500" placeholder="******">
            
            <button id="btn-ingresar" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-lg transition">Ingresar</button>
        </div>
    </div>

    <div id="app-principal" class="hidden max-w-md mx-auto bg-gray-900 min-h-screen flex flex-col">
        
        <header class="bg-gray-800 p-4 shadow-md flex justify-between items-center border-b border-gray-700 sticky top-0">
            <div>
                <h1 class="text-xl font-bold text-blue-400">Lavadero</h1>
                <p id="nombre-usuario-activo" class="text-sm text-gray-400"></p>
            </div>
            <button id="btn-cerrar-sesion" class="bg-red-600 hover:bg-red-500 px-3 py-1 rounded text-sm font-bold">Salir</button>
        </header>

        <main class="flex-1 p-4 overflow-y-auto">
            
            <div id="vista-empleado" class="hidden space-y-6">
                
                <div class="bg-gray-800 p-4 rounded-xl border border-gray-700">
                    <h2 class="text-lg font-bold mb-3 text-blue-300">Registrar Lavado</h2>
                    <input type="text" id="placa" placeholder="PLACA (Ej: ABC-123)" class="w-full p-3 bg-gray-700 rounded-lg mb-3 uppercase font-bold text-center">
                    
                    <select id="tipo" class="w-full p-3 bg-gray-700 rounded-lg mb-3">
                        <option value="15000">Moto - $15,000</option>
                        <option value="25000">Carro Sencillo - $25,000</option>
                        <option value="35000">Camioneta - $35,000</option>
                    </select>

                    <select id="lavador" class="w-full p-3 bg-gray-700 rounded-lg mb-3">
                        <option value="Juan">Jesús</option>
                        <option value="Pedro">Santiago</option>
                    </select>
                    
                    <button id="btn-registrar" class="w-full bg-green-600 hover:bg-green-500 py-3 rounded-lg font-bold text-lg shadow-lg">Guardar Lavado</button>
                </div>

                <div class="bg-gray-800 p-4 rounded-xl border border-gray-700">
                    <h2 class="text-lg font-bold mb-3 text-orange-300">Solicitar Vale</h2>
                    <input type="number" id="monto-prestamo" placeholder="Monto (Ej: 10000)" class="w-full p-3 bg-gray-700 rounded-lg mb-3">
                    <button id="btn-prestamo" class="w-full bg-orange-600 hover:bg-orange-500 py-3 rounded-lg font-bold shadow-lg">Registrar Vale</button>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div class="bg-gray-800 p-3 rounded-xl border border-gray-700 text-center">
                        <p class="text-xs text-gray-400">Total Producido</p>
                        <p id="total-producido" class="text-xl font-bold text-white">$0</p>
                    </div>
                    <div class="bg-gray-800 p-3 rounded-xl border border-gray-700 text-center">
                        <p class="text-xs text-gray-400">Mi Ganancia (40%)</p>
                        <p id="total-ganancia" class="text-xl font-bold text-green-400">$0</p>
                    </div>
                    <div class="bg-gray-800 p-3 rounded-xl border border-gray-700 text-center col-span-2">
                        <p class="text-xs text-gray-400">Total Vales
